<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | CatBooking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Créer un compte</h1>

    <form action="/auth/register" method="POST" class="space-y-5">
        <input type="hidden" name="_csrf" value="{{csrfToken}}">

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse email</label>
            <input type="email" id="email" name="email" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            <input type="password" id="password" name="password" required minlength="10"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <p class="text-xs text-gray-500 mt-1">Au moins 10 caractères requis.</p>
        </div>

        <div>
            <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200">
            S’inscrire
        </button>

        <p class="text-sm text-gray-600 text-center mt-4">
            Déjà inscrit ?
            <a href="/auth/login" class="text-blue-600 hover:underline">Se connecter</a>
        </p>
    </form>

    <!-- Message d’erreur / succès (à afficher dynamiquement si besoin) -->
    <!-- <p class="text-center text-red-500 mt-4">Erreur : cet email existe déjà.</p> -->
</div>

</body>
</html>
