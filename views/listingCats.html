<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catalogue de Chats</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        h1 { text-align: center; }
        .catalogue { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .cat { background: white; padding: 15px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cat img { width: 100%; height: auto; border-radius: 6px; }
        .cat h2 { margin: 10px 0 5px; font-size: 1.2em; }
        .cat p { margin: 0; color: #666; }
    </style>
</head>

<div class="catalogue" id="cats">
